usage: |
  从懒猫微服启动应用后即可使用，保留懒猫登录验证。
  笔记数据库和附件持久保存在 /lzcapp/var/data。
  从旧版 0.0.1 升级前，请先备份数据库并导出旧容器的附件，详见适配仓库 README。
  新版移除了旧任务看板；旧任务会导出到 data/legacy-task-exports，不能直接在新版界面中编辑。
application:
  subdomain: notebook
  background_task: false
  multi_instance: false
  routes:
    # The approved 0.7.1 runtime stored /uploads/<name> links in note content.
    # LazyCat strips the route prefix and forwards to the new file API.
    - /uploads/=http://notebook.com.luck.lazycat.notebook.lzcapp:3000/api/file/
    - /=http://notebook.com.luck.lazycat.notebook.lzcapp:3000/
  depends_on:
    - notebook
services:
  notebook:
    # Approved store baseline. Real builds replace this with the completed
    # official mirror of the exact digest that passed the upgrade test.
    # upstream: docker.io/aidenzou/i-notebook:0.18.0@sha256:d160c721ce0015412bdd4671c885af59036ad4b55a679a979a0e29cb76217cf4
    image: registry.lazycat.cloud/peter/aidenzou/i-notebook:d2f252a9650108cd
    environment:
      - DATABASE_URL=file:/appdata/db.sqlite
      - 'SITE_URL=https://{{ .S.AppDomain }}'
    binds:
      # Preserve BOTH the historical host directory and database filename.
      - /lzcapp/var/data:/appdata
      - /lzcapp/var/data/uploads:/app/uploads
    setup_script: |
      node /lzcapp/pkg/content/prepare-runtime.mjs
    # Keep the upstream startup/migration command. It initializes only a
    # missing database and backs up an existing DB before schema migration.
    # No shared unlock code/JWT secret and no public_path are introduced.
