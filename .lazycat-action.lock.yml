    changelog: "iNotebook 0.17.1\n\n\U0001F389\U0001F389\U0001F389：本次更新围绕版本历史、Mermaid 图表、客户端性能与稳定性等方向进行了增强。\n新特性\n- 完善版本历史：优化快照时间窗口去重，恢复前自动保存未提交内容，并改用原生轻量预览。\n- Mermaid 图表增强：支持与标准 Markdown 双向互转，正文输入```mermaid回车可快捷唤起编辑。\n- 关于页面：版本号后展示 Git Commit ID，便于版本追溯。\n优化\n- 性能与流畅度：\n- 优化桌面端冷启动与首屏加载，调优本地数据读写吞吐。\n- 优化目录树渲染，修改标题与图标支持即时更新。\n- 问题修复：修复跨嵌入块选区坍缩问题，消除活跃度热力图多余滚动条。"
