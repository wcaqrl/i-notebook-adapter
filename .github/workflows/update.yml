name: Update i-notebook for LazyCat
run-name: ${{ (github.event_name == 'push' || (github.event_name == 'schedule' && vars.LAZYCAT_AUTO_PUBLISH != 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry-run)) && 'i-notebook → LazyCat [仅检查]' || 'i-notebook → LazyCat [验证升级、打包并送审]' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - scripts/**
      - tests/**
      - lazycat-action.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
      - icon.png
  schedule:
    # 05:23 UTC = 每天北京时间 13:23，GitHub 调度可能延迟。
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 勾选＝仅检查；取消勾选＝验证升级、转存镜像、打包并提交审核。
        type: boolean
        default: true
      retry-rejected:
        description: 修复适配后重试已被拒绝的源版本，分配新应用版本；须取消仅检查。
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: i-notebook-lazycat-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate adapter scripts and packaging guards
        run: |
          bash -n scripts/test-upgrade.sh
          python3 -B -m unittest discover -s tests -v
      - name: Exercise real upgrade and fresh installation when adapter code changes
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 -B scripts/upstream.py candidate > "${RUNNER_TEMP}/notebook-candidate.json"
          python3 - "${RUNNER_TEMP}/notebook-candidate.json" <<'PY'
          import json, os, sys
          c = json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"LAZYCAT_SOURCE_VERSION={c['version']}\nLAZYCAT_SOURCE_REF={c['ref']}\nLAZYCAT_SOURCE_REVISION={c['digest']}\n")
          PY
      - name: Run application verification on GitHub Runner
        if: github.event_name == 'push'
        run: ./scripts/test-upgrade.sh
      - name: Verify developer permission before real publication
        if: (github.event_name == 'workflow_dispatch' && !inputs.dry-run) || (github.event_name == 'schedule' && vars.LAZYCAT_AUTO_PUBLISH == 'true')
        env:
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
        run: |
          set -euo pipefail
          git push --dry-run origin "HEAD:${GITHUB_REF_NAME}"
          if [[ -z "${LZC_API_TOKEN}" ]]; then
            echo '::error::Configure LZC_API_TOKEN in this adapter repository Actions Secrets.'
            exit 1
          fi
          response_file="${RUNNER_TEMP}/notebook-review-access.json"
          curl --fail --silent --show-error --retry 2 \
            --header "X-API-Token: ${LZC_API_TOKEN}" \
            --output "${response_file}" \
            'https://appstore.api.lazycat.cloud/sdk/v3/developer/app/com.luck.lazycat.notebook/review/list?page=0&size=1'
          python3 - "${response_file}" <<'PY'
          import json, sys
          with open(sys.argv[1]) as response:
              result = json.load(response)
          if result.get('errorCode') != 0:
              raise SystemExit('Developer PAT cannot access com.luck.lazycat.notebook: ' + str(result.get('msg', 'unknown error')))
          print('Developer access to com.luck.lazycat.notebook verified.')
          PY

  update:
    needs: validate
    uses: wcaqrl/lazycat-action/.github/workflows/lazycat.yml@v1
    with:
      config: lazycat-action.yml
      operation: auto
      runner: ubuntu-24.04
      dry-run: ${{ github.event_name == 'push' || (github.event_name == 'schedule' && vars.LAZYCAT_AUTO_PUBLISH != 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
      retry-rejected: ${{ github.event_name == 'workflow_dispatch' && inputs.retry-rejected || false }}
    secrets:
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
