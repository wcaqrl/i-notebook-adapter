    changelog: "iNotebook 0.18.0\n\n\U0001F389\U0001F389\U0001F389：本次更新带来了全新的 全景关系图谱、轻量级图表引擎、双向链接深度优化 与 更稳固的安全隐私防护。\n新特性\n- 全新全景关系图谱：支持径向布局、独立控制抽屉与右侧笔记实时预览，全局知识网络一目了然\n- 关系图谱秒开体验：配合预加载与雷达骨架屏技术，大型图谱瞬间呈现，告别白屏等待\n- 局域网私有化开箱即用：网络环境自适应优化，家庭 NAS 与局域网私有部署免配置顺畅运行\n- 账户安全与隐私全面加固：密码修改后历史登录即时失效，公开分享内容严格脱敏，守护数据隐私\n- 【编辑器】新增智能空行提示，圆点清晰指示输入位置，并在光标聚焦时自动隐去\n优化\n- 【图表】Mermaid 图表引擎全面轻量化，渲染更迅速，且无感跟随深浅主题平滑切换\n- 【双链】双向链接检索与加载速度提升数倍，并支持键盘无障碍快捷浏览\n- 【链接识别】优化未链接提及识别，智能排除网址内的关键词误匹配，保护链接完整\n- 【导出】增强右键“复制为 Markdown”，复杂图文、卡片与图表内容无损完整导出\n- 【排版】规范编辑器内边距，文本与文档标题、图标严格对齐，视觉更舒适\n- 【集合】整合集合管理入口，优化表格工具栏交互并修复偶发报错\n- 更小的运行体积与更强韧流畅的系统性能"
